name: Threads Scheduler

on:
  # Запускает только cron-job.org (workflow_dispatch каждые 5 минут, точно по
  # времени). Своего schedule нет: GitHub исполнял его с опозданием на часы и
  # в публичном репозитории отключает расписания после 60 дней без коммитов.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduler
  cancel-in-progress: false  # не отменять запущенный — посты должны дойти

jobs:
  publish:
    runs-on: ubuntu-latest
    # Instagram/TikTok обрабатывают видео у себя (до 3 минут на ролик), YouTube
    # ролик скачивает и заливает сам публикатор, плюс пауза между постами —
    # в прежние 10 минут запуск с несколькими видео уже не укладывается.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scheduler
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          WORKSPACE_API_URL: ${{ secrets.WORKSPACE_API_URL }}
          WORKSPACE_API_KEY: ${{ secrets.WORKSPACE_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
        run: python scheduler.py
