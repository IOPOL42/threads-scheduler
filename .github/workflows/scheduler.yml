name: Threads Scheduler

on:
  schedule:
    # Публикация идёт только в двух окнах, 07:30–14:30 и 19:00–21:30 МСК —
    # вне них постов в очереди с queued_at всё равно не бывает, крутиться
    # круглые сутки незачем. Окна в UTC (МСК = UTC+3): 04:30–11:30 и 16:00–18:30.
    - cron: '30-55/5 4 * * *'   # 07:30–07:55 МСК
    - cron: '*/5 5-10 * * *'    # 08:00–13:55 МСК
    - cron: '0-30/5 11 * * *'   # 14:00–14:30 МСК
    - cron: '*/5 16-17 * * *'   # 19:00–20:55 МСК
    - cron: '0-30/5 18 * * *'   # 21:00–21:30 МСК
  workflow_dispatch:        # ручной запуск из GitHub UI

permissions:
  contents: read

concurrency:
  group: scheduler
  cancel-in-progress: false  # не отменять запущенный — посты должны дойти

jobs:
  publish:
    runs-on: ubuntu-latest
    # Instagram/TikTok обрабатывают видео у себя (до 3 минут на ролик), YouTube
    # ролик скачивает и заливает сам публикатор, плюс пауза между постами —
    # в прежние 10 минут запуск с несколькими видео уже не укладывается.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scheduler
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          WORKSPACE_API_URL: ${{ secrets.WORKSPACE_API_URL }}
          WORKSPACE_API_KEY: ${{ secrets.WORKSPACE_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
        run: python scheduler.py
