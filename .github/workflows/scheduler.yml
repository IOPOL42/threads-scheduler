name: Threads Scheduler

on:
  schedule:
    - cron: '*/5 * * * *'  # каждые 5 минут
  workflow_dispatch:        # ручной запуск из GitHub UI

concurrency:
  group: scheduler
  cancel-in-progress: false  # не отменять запущенный — посты должны дойти

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run scheduler
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          WORKSPACE_API_URL: ${{ secrets.WORKSPACE_API_URL }}
          WORKSPACE_API_KEY: ${{ secrets.WORKSPACE_API_KEY }}
        run: python scheduler.py
